[build]
  command = "node scripts/check-deploy.mjs && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_WHATSAPP = "5598885916645"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/sitemap.xml"
  to = "/api/sitemap"
  status = 200

[context.deploy-preview.environment]
  NEXT_PUBLIC_SUPABASE_URL = "https://bzhrugqkwxlyfdgtenlt.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_2iW1rcg9QePwOUEM3RJzfw_UF1LFCmc"
  NEXT_PUBLIC_APP_ENV = "homologacao"

[context.branch-deploy.environment]
  NEXT_PUBLIC_SUPABASE_URL = "https://bzhrugqkwxlyfdgtenlt.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_2iW1rcg9QePwOUEM3RJzfw_UF1LFCmc"
